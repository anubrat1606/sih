# Render Blueprint -- deploys the orchestrator API and the frontend as two
# free services, both reachable over HTTPS from any network. No Docker.
#
# Why this exists: local Postgres and Docker both turned out to be blocked
# or unavailable on some team members' networks/machines (docs/STATUS.md,
# "Database access" and the Docker decline). Neon already solves the
# database half for anyone whose own network reaches port 5432; this
# solves the rest by putting the whole app somewhere with normal network
# access, so it never depends on any one person's wifi again.
#
# Setup (one time, in the Render dashboard): New -> Blueprint -> connect
# this GitHub repo. Render reads this file and proposes both services
# below. Fill in the env vars marked `sync: false` when prompted -- they
# are never committed here. See docs/DEPLOYMENT.md for the full walkthrough.
#
# If Render suggests different service names than the ones below (e.g. a
# name is already taken and it appends a suffix), update
# SATYAPRAMANA_FRONTEND_ORIGIN and VITE_BACKEND_URL below to match the
# actual assigned *.onrender.com hostnames before deploying.

services:
  - type: web
    name: sih26100-orchestrator
    runtime: python
    plan: free
    rootDir: services/orchestrator
    buildCommand: pip install -r requirements.txt -e ../core
    startCommand: uvicorn satyapramana_store.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Paste the team's shared Neon connection string here (Render dashboard,
      # not this file) -- postgresql://...neon.tech/neondb?sslmode=require&channel_binding=require
      - key: DATABASE_URL
        sync: false
      - key: SATYAPRAMANA_MIGRATE_ON_START
        value: "1"
      - key: SATYAPRAMANA_FRONTEND_ORIGIN
        value: https://sih26100-frontend.onrender.com
      # Auto-generated by Render on first deploy -- nobody needs to invent
      # or share this one.
      - key: SATYAPRAMANA_JWT_SECRET
        generateValue: true
      # Same admin login for the whole team, since the database is shared.
      - key: SATYAPRAMANA_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: SATYAPRAMANA_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Optional -- leave unset and PAN/GST/CIN verification honestly stays
      # AWAITING_CREDENTIALS instead of silently going LIVE with no key.
      - key: SATYAPRAMANA_SANDBOX_API_KEY
        sync: false
      - key: SATYAPRAMANA_SANDBOX_API_SECRET
        sync: false
      - key: SATYAPRAMANA_SANDBOX_ENV
        sync: false
      # Optional -- leave unset and EXPLAIN / Tender Intelligence honestly
      # report unavailable instead of fabricating anything.
      - key: SATYAPRAMANA_GEMINI_API_KEY
        sync: false
      - key: SATYAPRAMANA_GEMINI_MODEL
        sync: false

  - type: web
    name: sih26100-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://sih26100-orchestrator.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
